# Builds the trawl-scan binaries the install scripts download.
#
# The scanner is what the "web exploration" page connects to. Users never build
# it: they run a one-liner that fetches the binary for their machine from the
# release this workflow publishes. So the binary names here are a contract with
# static/install.sh and static/install.ps1 — trawl-scan-<cpu>-<platform> — and
# must not drift from them.
#
# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: trawl-scan-x86_64-windows.exe
            built: trawl-scan.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: trawl-scan-x86_64-macos
            built: trawl-scan
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: trawl-scan-aarch64-macos
            built: trawl-scan
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: trawl-scan-x86_64-linux
            built: trawl-scan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Build the scanner
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path trawl-scan/Cargo.toml

      - name: Name the binary
        shell: bash
        run: |
          src="trawl-scan/target/${{ matrix.target }}/release/${{ matrix.built }}"
          cp "$src" "${{ matrix.asset }}"

      - name: Generate checksum
        shell: bash
        run: |
          asset="${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(sha256sum "$asset" | cut -d ' ' -f1)"
          else
            hash="$(shasum -a 256 "$asset" | cut -d ' ' -f1)"
          fi
          printf '%s  %s\n' "$hash" "$asset" > "$asset.sha256"

      - name: Publish to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          make_latest: false
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  # The installers fetch whatever is marked latest, so a release only gets that once every
  # platform's binary is on it. One that fails to build, or never gets a runner, leaves them
  # on the last complete release.
  latest:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Mark this release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest
